# GUÍA: Sirve React y actúa como puente HTTP al backend en la red privada de Docker.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # El formulario de productos puede enviar imágenes codificadas en Base64.
    client_max_body_size 4m;

    # DNS interno de Docker: actualiza la IP si se recrea el contenedor backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    # No convertir errores de API en páginas HTML de React.
    location ~ ^/(api(?:/|$)|v3/api-docs(?:/|$)|swagger-ui(?:/|\.html$)|actuator/health/readiness$) {
        gzip off;
        proxy_pass $backend;
    }

    # GUÍA: React Router funciona también al recargar /login, /dashboard, etc.
    # GUÍA: Comprime solo contenido público; no cachea ni comprime respuestas autenticadas.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    # GUÍA: Vite genera nombres con hash; pueden conservarse durante un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /img/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    # GUÍA: Compatibilidad con rutas PNG/JPG guardadas en MySQL y localStorage.
    location = "/img/Despensa.png" { rewrite ^ "/img/Despensa.webp" last; }
    location = "/img/Frutas.png" { rewrite ^ "/img/Frutas.webp" last; }
    location = "/img/Herbas.png" { rewrite ^ "/img/Herbas.webp" last; }
    location = "/img/Lacteos.png" { rewrite ^ "/img/Lacteos.webp" last; }
    location = "/img/Organico.png" { rewrite ^ "/img/Organico.webp" last; }
    location = "/img/cesta de verduras.png" { rewrite ^ "/img/cesta de verduras.webp" last; }
    location = "/img/co2.png" { rewrite ^ "/img/co2.webp" last; }
    location = "/img/cultivo.png" { rewrite ^ "/img/cultivo.webp" last; }
    location = "/img/fondo1.png" { rewrite ^ "/img/fondo1.webp" last; }
    location = "/img/fondo_inicio.png" { rewrite ^ "/img/fondo_inicio.webp" last; }
    location = "/img/gracias-huerto.png" { rewrite ^ "/img/gracias-huerto.webp" last; }
    location = "/img/grafico.png" { rewrite ^ "/img/grafico.webp" last; }
    location = "/img/icon_perfil.png" { rewrite ^ "/img/icon_perfil.webp" last; }
    location = "/img/instagram.png" { rewrite ^ "/img/instagram.webp" last; }
    location = "/img/lateral-huerto.png" { rewrite ^ "/img/lateral-huerto.webp" last; }
    location = "/img/logo_1.png" { rewrite ^ "/img/logo_1.webp" last; }
    location = "/img/mapa-ruta.png" { rewrite ^ "/img/mapa-ruta.webp" last; }
    location = "/img/mapa.png" { rewrite ^ "/img/mapa.webp" last; }
    location = "/img/naranjas_valencia.jpg" { rewrite ^ "/img/naranjas_valencia.webp" last; }
    location = "/img/portada-camion.png" { rewrite ^ "/img/portada-camion.webp" last; }
    location = "/img/reciclaje-compos.png" { rewrite ^ "/img/reciclaje-compos.webp" last; }
    location = "/img/referencia-seguimiento.png" { rewrite ^ "/img/referencia-seguimiento.webp" last; }
    location = "/img/verduras.png" { rewrite ^ "/img/verduras.webp" last; }
}
